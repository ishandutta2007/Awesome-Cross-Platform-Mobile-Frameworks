<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="40%" stop-color="#0e172a"/><stop offset="100%" stop-color="#070b14"/></linearGradient><linearGradient id="textGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".25"/><stop offset="100%" stop-color="#38bdf8" stop-opacity=".1"/></linearGradient><linearGradient id="pillGrad2" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".25"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".1"/></linearGradient><linearGradient id="glowGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".15"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></linearGradient><linearGradient id="glowGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".15"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".4" stroke-width=".7" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(3deg)}}@keyframes pulseLight{0%{opacity:.2;transform:scale(1)}50%{opacity:.45;transform:scale(1.08)}}.badge-text,.desc-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.badge-text{font-size:13px;font-weight:600;fill:#cbd5e1}.title-text{font-weight:800}.desc-text{font-weight:400;font-size:15px;fill:#94a3b8;letter-spacing:.3px}.animated-glow-1{transform-origin:200px 100px;animation:pulseLight 6s ease-in-out infinite}.animated-glow-2{transform-origin:1000px 250px;animation:pulseLight 8s ease-in-out infinite 1s}.animated-circuit{stroke-dasharray:8 6;animation:dashMove 4s linear infinite}</style></defs><rect width="100%" height="100%" fill="url(#bgGradient)" rx="16"/><rect width="100%" height="100%" fill="url(#grid)" rx="16"/><circle cx="220" cy="90" r="180" fill="url(#glowGrad1)" class="animated-glow-1"/><circle cx="980" cy="270" r="220" fill="url(#glowGrad2)" class="animated-glow-2"/><g class="animated-circuit" opacity=".35"><path fill="none" stroke="#0284c7" stroke-width="1.5" d="M 60 40 L 320 40 L 400 120"/><path fill="none" stroke="#8b5cf6" stroke-width="1.5" d="M 1140 320 L 880 320 L 800 240"/><circle cx="320" cy="40" r="3" fill="#38bdf8"/><circle cx="880" cy="320" r="3" fill="#a855f7"/></g><g transform="translate(60, 48)"><rect width="275" height="30" fill="url(#pillGrad1)" stroke="#0284c7" stroke-opacity=".5" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4.5" fill="#38bdf8"/><text x="32" y="20" fill="#38bdf8" class="badge-text">MOBILE ARCHITECTURE &amp; SDKs</text></g><text x="60" y="145" fill="url(#textGradient)" class="title-text" font-size="44">Awesome Cross-Platform Mobile Frameworks</text><text x="60" y="185" class="desc-text">A curated index of production-ready cross-platform engines, runtimes, native bridges, and developer cloud services.</text><g><g transform="translate(60, 230) translate(0, 0)"><rect width="130" height="38" fill="#1e293b" fill-opacity=".7" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="24" class="badge-text">⚡ React Native</text></g><g transform="translate(60, 230) translate(142, 0)"><rect width="100" height="38" fill="#1e293b" fill-opacity=".7" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="24" class="badge-text">💙 Flutter</text></g><g transform="translate(60, 230) translate(254, 0)"><rect width="175" height="38" fill="#1e293b" fill-opacity=".7" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="24" class="badge-text">🟣 Kotlin Multiplatform</text></g><g transform="translate(60, 230) translate(441, 0)"><rect width="160" height="38" fill="#1e293b" fill-opacity=".7" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="24" class="badge-text">🌐 Capacitor &amp; Ionic</text></g><g transform="translate(60, 230) translate(613, 0)"><rect width="140" height="38" fill="#1e293b" fill-opacity=".7" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="24" class="badge-text">🦀 Tauri Mobile</text></g><g transform="translate(60, 230) translate(765, 0)"><rect width="125" height="38" fill="#1e293b" fill-opacity=".7" stroke="#334155" stroke-width="1" rx="8"/><text x="16" y="24" class="badge-text">🔷 .NET MAUI</text></g></g><g transform="translate(60, 305)"><circle cx="6" cy="6" r="4" fill="#10b981"/><text x="20" y="10" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Multi-Platform • iOS • Android • Web • Desktop • Continuous CI/CD</text></g><rect width="1199" height="359" x=".5" y=".5" fill="none" stroke="#334155" stroke-opacity=".6" stroke-width="1" rx="16"/></svg>