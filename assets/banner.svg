<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="40%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
    </pattern>

    <style>
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 15px; fill: #94a3b8; letter-spacing: 0.3px; }
      
      /* Subtle animated glowing rings in the background */
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }

      .animated-glow-1 {
        transform-origin: 200px 100px;
        animation: pulseLight 6s ease-in-out infinite;
      }
      .animated-glow-2 {
        transform-origin: 1000px 250px;
        animation: pulseLight 8s ease-in-out infinite 1s;
      }
      .animated-circuit {
        stroke-dasharray: 8 6;
        animation: dashMove 4s linear infinite;
      }
      .floating-decor {
        animation: floatSlow 7s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="16" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Ambient Light Orbs (Background layer) -->
  <circle cx="220" cy="90" r="180" fill="url(#glowGrad1)" class="animated-glow-1" />
  <circle cx="980" cy="270" r="220" fill="url(#glowGrad2)" class="animated-glow-2" />

  <!-- Dynamic Cyber/Circuit Accent Lines (Background decorative) -->
  <g opacity="0.35" class="animated-circuit">
    <path d="M 60 40 L 320 40 L 400 120" stroke="#0284c7" stroke-width="1.5" fill="none" />
    <path d="M 1140 320 L 880 320 L 800 240" stroke="#8b5cf6" stroke-width="1.5" fill="none" />
    <circle cx="320" cy="40" r="3" fill="#38bdf8" />
    <circle cx="880" cy="320" r="3" fill="#a855f7" />
  </g>

  <!-- Foreground Content: Header Tag Pill -->
  <g transform="translate(60, 48)">
    <rect width="275" height="30" rx="15" fill="url(#pillGrad1)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
    <text x="32" y="20" class="badge-text" fill="#38bdf8">MOBILE ARCHITECTURE &amp; SDKs</text>
  </g>

  <!-- Title & Subtitle (Always prominent in foreground) -->
  <text x="60" y="145" class="title-text" font-size="44" fill="url(#textGradient)">
    Awesome Cross-Platform Mobile Frameworks
  </text>
  <text x="60" y="185" class="desc-text">
    A curated index of production-ready cross-platform engines, runtimes, native bridges, and developer cloud services.
  </text>

  <!-- Feature Tags / Chips Row -->
  <g transform="translate(60, 230)">
    <!-- Chip 1: React Native -->
    <g transform="translate(0, 0)">
      <rect width="130" height="38" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" class="badge-text">⚡ React Native</text>
    </g>
    <!-- Chip 2: Flutter -->
    <g transform="translate(142, 0)">
      <rect width="100" height="38" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" class="badge-text">💙 Flutter</text>
    </g>
    <!-- Chip 3: Kotlin Multiplatform -->
    <g transform="translate(254, 0)">
      <rect width="175" height="38" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" class="badge-text">🟣 Kotlin Multiplatform</text>
    </g>
    <!-- Chip 4: Capacitor & Ionic -->
    <g transform="translate(441, 0)">
      <rect width="160" height="38" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" class="badge-text">🌐 Capacitor &amp; Ionic</text>
    </g>
    <!-- Chip 5: Tauri Mobile -->
    <g transform="translate(613, 0)">
      <rect width="140" height="38" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" class="badge-text">🦀 Tauri Mobile</text>
    </g>
    <!-- Chip 6: .NET MAUI -->
    <g transform="translate(765, 0)">
      <rect width="125" height="38" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" class="badge-text">🔷 .NET MAUI</text>
    </g>
  </g>

  <!-- Bottom Metric / Status Row -->
  <g transform="translate(60, 305)">
    <circle cx="6" cy="6" r="4" fill="#10b981" />
    <text x="20" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" font-weight="500">
      Multi-Platform • iOS • Android • Web • Desktop • Continuous CI/CD
    </text>
  </g>

  <!-- Border Highlight -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" stroke="#334155" stroke-width="1" stroke-opacity="0.6" fill="none" />
</svg>
